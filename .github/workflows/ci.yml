name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The nightly e2e: the sample jobs below build real projects, so a change on
  # Apple's or Google's side shows up here even on a day nobody pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.89"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  ios-sample:
    name: iOS sample (real xcresult)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Which Xcode
        run: |
          xcodebuild -version
          xcrun xcresulttool version || true

      - run: cargo build --release

      # The point of this job: a real .xcresult, converted by the same code
      # the unit tests exercise against fixtures.
      - name: Run the sample's tests through shlane
        working-directory: examples/ios-sample
        run: ../../target/release/shlane run test

      - name: Check the JUnit report describes the real run
        working-directory: examples/ios-sample
        run: |
          test -f build/junit.xml || { echo "no JUnit report was written"; exit 1; }
          cat build/junit.xml
          grep -q 'testStartsAtZero' build/junit.xml || { echo "the report is missing a test"; exit 1; }
          grep -q 'failures="0"' build/junit.xml || { echo "the report claims failures"; exit 1; }

      # Apple's schema is not ours, and it moves. Keeping the raw output means
      # a change can be read rather than guessed at.
      - name: Keep the raw xcresulttool output
        if: always()
        working-directory: examples/ios-sample
        run: |
          xcrun xcresulttool get test-results tests \
            --path build/tests.xcresult --format json > build/xcresulttool.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult-json
          path: examples/ios-sample/build/xcresulttool.json

  android-sample:
    name: Android sample (real Gradle build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The sample has no wrapper, so the gradle action falls back to this.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - run: cargo build

      - name: Run the sample's tests through shlane
        working-directory: examples/android-sample
        run: ../../target/debug/shlane run test

      - name: Build and sign an APK and an AAB through shlane
        working-directory: examples/android-sample
        run: ../../target/debug/shlane run release

      - name: Check both are really signed
        working-directory: examples/android-sample
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs build/counter-signed.apk | tee apk.txt
          grep -q 'CN=shlane sample' apk.txt || { echo "the APK is not signed with the sample key"; exit 1; }
          # jarsigner exits 0 for an unsigned jar too, so read what it says.
          jarsigner -verify build/counter-signed.aab | tee aab.txt
          grep -q 'jar verified' aab.txt || { echo "the AAB is not signed"; exit 1; }

  package:
    name: the crate still publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cargo.toml points at README.md and LICENSE, and `exclude` decides what
      # a `cargo install` downloads. Both are easy to break without noticing
      # until the day of a release.
      - run: cargo publish --dry-run

  example:
    name: example config runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: run the example lanes
        working-directory: example
        run: |
          ../target/debug/shlane run deploy target=production
          ../target/debug/shlane run deploy target=staging
