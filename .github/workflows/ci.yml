name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The nightly e2e: the sample jobs below build real projects, so a change on
  # Apple's or Google's side shows up here even on a day nobody pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.89"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  ios-sample:
    name: iOS sample (real xcresult and archive)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Which Xcode
        run: |
          xcodebuild -version
          xcrun xcresulttool version || true

      - run: cargo build --release

      # The point of this job: a real .xcresult, converted by the same code
      # the unit tests exercise against fixtures.
      - name: Run the sample's tests through shlane
        working-directory: examples/ios-sample
        run: ../../target/release/shlane run test

      - name: Check the JUnit report describes the real run
        working-directory: examples/ios-sample
        run: |
          test -f build/junit.xml || { echo "no JUnit report was written"; exit 1; }
          cat build/junit.xml
          grep -q 'testStartsAtZero' build/junit.xml || { echo "the report is missing a test"; exit 1; }
          grep -q 'failures="0"' build/junit.xml || { echo "the report claims failures"; exit 1; }

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # build_ios against a real app target. Unsigned, so it stops at the
      # archive; exporting an .ipa needs an Apple account.
      - name: Archive the sample app through shlane
        working-directory: examples/ios-sample
        run: ../../target/release/shlane run archive

      - name: Check the archive holds the app
        working-directory: examples/ios-sample
        run: |
          app=build/CounterApp.xcarchive/Products/Applications/CounterApp.app
          test -d "$app" || { echo "no app in the archive"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"

      # Apple's schema is not ours, and it moves. Keeping the raw output means
      # a change can be read rather than guessed at.
      - name: Keep the raw xcresulttool output
        if: always()
        working-directory: examples/ios-sample
        run: |
          xcrun xcresulttool get test-results tests \
            --path build/tests.xcresult --format json > build/xcresulttool.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcresult-json
          path: examples/ios-sample/build/xcresulttool.json

  android-sample:
    name: Android sample (real Gradle build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The sample has no wrapper, so the gradle action falls back to this.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - run: cargo build

      - name: Run the sample's tests through shlane
        working-directory: examples/android-sample
        run: ../../target/debug/shlane run test

      - name: Build and sign an APK and an AAB through shlane
        working-directory: examples/android-sample
        run: ../../target/debug/shlane run release

      - name: Check both are really signed
        working-directory: examples/android-sample
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs build/counter-signed.apk | tee apk.txt
          grep -q 'CN=shlane sample' apk.txt || { echo "the APK is not signed with the sample key"; exit 1; }
          # jarsigner exits 0 for an unsigned jar too, so read what it says.
          jarsigner -verify build/counter-signed.aab | tee aab.txt
          grep -q 'jar verified' aab.txt || { echo "the AAB is not signed"; exit 1; }

  docs:
    name: the documentation site builds
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mdBook renders an include whose file moved, or whose anchor was renamed,
      # as a page with nothing but its title on it — and still exits 0. The build
      # proves the book compiles; this test proves it says anything.
      - run: cargo test --test docs_site
      - run: mdbook build docs/site
      # A link written for GitHub resolves against a different place on the site,
      # and mdBook rewrites `.md` to `.html` on the way, so it breaks in the
      # browser and nowhere else. This reads the built HTML, which is the only
      # place that failure is visible.
      - run: python3 docs/site/check-links.py docs/site/book

  package:
    name: the crate still publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cargo.toml points at README.md and LICENSE, and `exclude` decides what
      # a `cargo install` downloads. Both are easy to break without noticing
      # until the day of a release.
      - run: cargo publish --dry-run

  example:
    name: example config runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: run the example lanes
        working-directory: example
        run: |
          ../target/debug/shlane run deploy target=production
          ../target/debug/shlane run deploy target=staging

  installer:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: What it picks for each machine
        if: runner.os == 'Linux'
        run: tests/install-sh.sh
      # The rest installs the latest release for real. install.sh prints the
      # version it installed by running the binary, so this also says the
      # download works on this machine.
      - name: Install the latest release
        shell: bash
        env:
          INSTALL_DIR: ${{ runner.temp }}/shlane-installer
        run: |
          dir="$INSTALL_DIR"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -u "$INSTALL_DIR")"; fi
          SHLANE_INSTALL_DIR="$dir" sh ./install.sh

  action:
    name: the GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - id: shlane
        uses: ./
      - name: It is on PATH and said which version it is
        shell: bash
        run: |
          shlane --version
          version="${{ steps.shlane.outputs.version }}"
          [ -n "$version" ] || { echo "the action reported no version"; exit 1; }
          echo "installed $version"
