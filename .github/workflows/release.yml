name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one most people doing mobile work are on.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          # Steps still run in a POSIX shell; windows-latest has one.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.linker || matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }} ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="shlane-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/shlane${{ matrix.exe }}" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # shasum is not on a Windows runner; sha256sum is, through git bash.
          if command -v shasum >/dev/null; then
            sum=$(shasum -a 256 "dist/${name}.tar.gz" | cut -d' ' -f1)
          else
            sum=$(sha256sum "dist/${name}.tar.gz" | cut -d' ' -f1)
          fi
          echo "${sum}  ${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect the checksums into one file
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Take the release notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md" > notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: notes.md

  homebrew:
    name: update the tap
    needs: publish
    runs-on: ubuntu-latest
    # Skipped rather than failed when the tap is not set up: a release should
    # not go red because a distribution channel nobody configured is missing.
    if: ${{ github.repository == 'prongbang/shlane' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rebuild SHA256SUMS from the artifacts
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Generate the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./packaging/homebrew/generate.sh "$version" dist/SHA256SUMS > /tmp/shlane.rb
          cat /tmp/shlane.rb

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap was not updated."
            echo "See packaging/homebrew/README.md for what to create."
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/prongbang/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp /tmp/shlane.rb tap/Formula/shlane.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/shlane.rb
          git commit -m "shlane ${version}" || { echo "the formula is already current"; exit 0; }
          git push
