name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Before anything is built: a tag pushed ahead of the version bump once
  # shipped binaries named 0.2.2 that reported 0.2.1, and a published release
  # has to be deleted by hand.
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $crate in Cargo.toml; bump Cargo.toml, commit, then tag"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one most people doing mobile work are on.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          # Steps still run in a POSIX shell; windows-latest has one.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.linker || matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }} ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="shlane-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/shlane${{ matrix.exe }}" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # shasum is not on a Windows runner; sha256sum is, through git bash.
          if command -v shasum >/dev/null; then
            sum=$(shasum -a 256 "dist/${name}.tar.gz" | cut -d' ' -f1)
          else
            sum=$(sha256sum "dist/${name}.tar.gz" | cut -d' ' -f1)
          fi
          echo "${sum}  ${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect the checksums into one file
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Take the release notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md" > notes.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: notes.md


  crates-io:
    name: publish to crates.io
    needs: [version, publish]
    runs-on: ubuntu-latest
    # Only for a pushed tag: a manual run builds whatever branch it was started
    # on, and crates.io cannot take a version back.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, so shlane $VERSION was not published; run cargo publish by hand"
            exit 0
          fi
          # Already there -- published by hand, or a re-run -- is not a failure.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "shlane release (https://github.com/prongbang/shlane)" \
            "https://crates.io/api/v1/crates/shlane/$VERSION")
          if [ "$status" = 200 ]; then
            echo "shlane $VERSION is already on crates.io"
            exit 0
          fi
          cargo publish --locked
