[package]
name = "shlane"
version = "0.2.1"
edition = "2021"
# Raised from 1.74 by ureq (1.85), then by aes 0.9.3 (1.89). `cargo install`
# resolves fresh rather than from the lockfile, so the number here has to be
# what a fresh resolve needs, not what this repository's lockfile happens to
# pin.
rust-version = "1.89"
description = "A fastlane-like automation tool written in Rust with Rhai scripting support"
authors = ["prongbang"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/prongbang/shlane"
keywords = ["automation", "ci", "build", "scripting", "devops"]
categories = ["command-line-utilities", "development-tools"]
# What a crates.io download does not need: CI, the benchmark harness, the
# sample projects and the planning documents. The schema reference stays,
# because it is the reference for the thing being installed.
exclude = [
    ".github/",
    "benchmarks/",
    "docs/plan/",
    "example/",
    "examples/",
    "action.yml",
    "install.sh",
]

[dependencies]
aes = "0.9.2"
cbc = "0.2.1"
clap = { version = "4.5.38", features = ["derive"] }
clap_complete = "4.5"
md-5 = "0.11.0"
rhai = { version = "1.21", features = ["serde"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
ureq = { version = "3.2.1", features = ["rustls"] }

# Only needed to stop a timed-out step's whole process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Optimize for size and performance
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "shlane"
path = "src/main.rs"
