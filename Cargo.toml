[package]
name = "shlane"
version = "0.1.0"
edition = "2021"
# Raised from 1.74 by ureq, which needs 1.85.
rust-version = "1.85"
description = "A fastlane-like automation tool written in Rust with Rhai scripting support"
authors = ["prongbang"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/prongbang/shlane"
keywords = ["automation", "ci", "build", "scripting", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
clap_complete = "4.5"
rhai = { version = "1.21", features = ["serde"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
ureq = { version = "3.2.1", features = ["rustls"] }

# Only needed to stop a timed-out step's whole process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Optimize for size and performance
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "shlane"
path = "src/main.rs"
