[package]
name = "shlane"
version = "0.1.0"
edition = "2021"
description = "A fastlane-like automation tool written in Rust with Rhai scripting support"
authors = ["prongbang"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/prongbang/shlane"
keywords = ["automation", "ci", "build", "scripting", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
rhai = { version = "1.21", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
# Optimize for size and performance
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "shlane"
path = "src/main.rs"
