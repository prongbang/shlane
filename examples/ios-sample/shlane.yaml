# Run from this directory on a machine with Xcode:
#
#   shlane run test
#   shlane run archive      # also needs XcodeGen (brew install xcodegen)
#
# This is the project the macOS CI job uses to check that test_ios really
# produces a JUnit report from a real .xcresult, and that build_ios really
# archives an app.
version: 1

lanes:
  test:
    description: "Run the unit tests and write a JUnit report"
    platform: ios
    steps:
      - id: tests
        action: test_ios
        with:
          scheme: Counter
          destination: "platform=iOS Simulator,name=iPhone 16"
          result_bundle: build/tests.xcresult
          junit: build/junit.xml
      - run: echo "report at ${steps.tests.junit}"

  build:
    description: "Build the library for a simulator"
    platform: ios
    steps:
      - run: xcodebuild build -scheme Counter -destination 'platform=iOS Simulator,name=iPhone 16'

  archive:
    description: "Archive the app without signing, so no Apple account is needed"
    platform: ios
    steps:
      - run: xcodegen generate --quiet --spec App/project.yml
      - id: app
        action: build_ios
        with:
          project: App/CounterApp.xcodeproj
          scheme: CounterApp
          # Unsigned, so it stops at the archive: exporting an .ipa needs a
          # certificate and a profile.
          skip_export: true
          allow_provisioning_updates: false
          xcargs: CODE_SIGNING_ALLOWED=NO
      - run: echo "archive at ${steps.app.archive}"
