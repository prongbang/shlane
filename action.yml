name: shlane
description: Run a shlane lane
author: prongbang

branding:
  icon: play-circle
  color: orange

inputs:
  lane:
    description: Lane to run. Leave empty to only install shlane.
    required: false
  params:
    description: Parameters for the lane, as `key=value` separated by spaces.
    required: false
    default: ""
  version:
    description: Version to install, or `latest`.
    required: false
    default: latest
  args:
    description: Extra arguments, e.g. `--report junit:reports/shlane.xml`.
    required: false
    default: ""
  working-directory:
    description: Directory to run in.
    required: false
    default: "."

outputs:
  version:
    description: The version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install shlane
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/shlane-bin
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # On Windows the runner hands out native paths (D:\a\_temp\...). bash
        # needs the POSIX form of them; GITHUB_PATH wants the native one back.
        posix() {
          if command -v cygpath >/dev/null 2>&1; then cygpath -u "$1"; else echo "$1"; fi
        }
        # install.sh works out the latest release when SHLANE_VERSION is unset.
        # An expression here cannot do it: `inputs.version == 'latest' && '' ||
        # inputs.version` is `latest`, because '' is false to GitHub.
        [ "$VERSION" = latest ] || export SHLANE_VERSION="$VERSION"
        dir="$(posix "$INSTALL_DIR")"
        # The action's own install.sh, so the script and the action stay the
        # same version.
        SHLANE_INSTALL_DIR="$dir" sh "$(posix "$ACTION_PATH")/install.sh"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        shlane="$dir/shlane"
        [ -x "$shlane" ] || shlane="$shlane.exe"
        echo "version=$("$shlane" --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Run the lane
      if: inputs.lane != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: shlane run ${{ inputs.lane }} ${{ inputs.params }} ${{ inputs.args }}
