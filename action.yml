name: shlane
description: Run a shlane lane
author: prongbang

branding:
  icon: play-circle
  color: orange

inputs:
  lane:
    description: Lane to run. Leave empty to only install shlane.
    required: false
  params:
    description: Parameters for the lane, as `key=value` separated by spaces.
    required: false
    default: ""
  version:
    description: Version to install, or `latest`.
    required: false
    default: latest
  args:
    description: Extra arguments, e.g. `--report junit:reports/shlane.xml`.
    required: false
    default: ""
  working-directory:
    description: Directory to run in.
    required: false
    default: "."

outputs:
  version:
    description: The version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install shlane
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/shlane-bin
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # On Windows the runner hands out native paths (D:\a\_temp\...). bash
        # needs the POSIX form of them; GITHUB_PATH wants the native one back.
        posix() {
          if command -v cygpath >/dev/null 2>&1; then cygpath -u "$1"; else echo "$1"; fi
        }
        # install.sh works out the latest release when SHLANE_VERSION is unset.
        # An expression here cannot do it: `inputs.version == 'latest' && '' ||
        # inputs.version` is `latest`, because '' is false to GitHub.
        [ "$VERSION" = latest ] || export SHLANE_VERSION="$VERSION"
        dir="$(posix "$INSTALL_DIR")"
        # The action's own install.sh, so the script and the action stay the
        # same version.
        SHLANE_INSTALL_DIR="$dir" sh "$(posix "$ACTION_PATH")/install.sh"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        shlane="$dir/shlane"
        [ -x "$shlane" ] || shlane="$shlane.exe"
        echo "version=$("$shlane" --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Run the lane
      if: inputs.lane != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SHLANE_LANE: ${{ inputs.lane }}
        SHLANE_PARAMS: ${{ inputs.params }}
        SHLANE_ARGS: ${{ inputs.args }}
      run: |
        split_words() {
          local input="$1" char quote= word= started=0 escaped=0 i
          parsed_words=()
          for ((i = 0; i < ${#input}; i++)); do
            char="${input:i:1}"
            if (( escaped )); then
              if [[ "$quote" == '"' && "$char" != "\\" && "$char" != '"' && "$char" != '$' && "$char" != '`' ]]; then word+="\\"; fi
              word+="$char"
              escaped=0
              started=1
            elif [[ "$char" == "\\" && "$quote" != "'" ]]; then
              escaped=1
              started=1
            elif [[ -n "$quote" ]]; then
              if [[ "$char" == "$quote" ]]; then quote=; else word+="$char"; fi
            elif [[ "$char" == "'" || "$char" == '"' ]]; then
              quote="$char"
              started=1
            elif [[ "$char" =~ [[:space:]] ]]; then
              if (( started )); then parsed_words+=("$word"); word=; started=0; fi
            else
              word+="$char"
              started=1
            fi
          done
          (( escaped )) && return 1
          [[ -z "$quote" ]] || return 1
          if (( started )); then parsed_words+=("$word"); fi
          return 0
        }

        split_words "$SHLANE_PARAMS" || { echo "invalid quoting in params" >&2; exit 2; }
        params=("${parsed_words[@]}")
        split_words "$SHLANE_ARGS" || { echo "invalid quoting in args" >&2; exit 2; }
        extra_args=("${parsed_words[@]}")
        shlane run "$SHLANE_LANE" "${params[@]}" "${extra_args[@]}"
