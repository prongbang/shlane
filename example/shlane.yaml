# shlane.yaml — example configuration
#
# Run it from this directory:
#   shlane run build
#   shlane run deploy target=production

# Environment variables handed to every command in every lane.
# Keep secrets out of this file — read them from the environment instead:
#   API_KEY: ${API_KEY}   <- planned for M2, see docs/plan/10-secrets-and-env.md
env:
  APP_ENV: "production"

# Rhai functions shared by every lane.
script: |-
  fn greet(name) {
      print("Hello from shared function, " + name + "!");
  }

lanes:
  build:
    before:
      - echo "Setting up build environment"
    steps:
      - run: "cargo build --release"
    script: |
      greet("Tester");
    after:
      - echo "Build completed"

  test:
    steps:
      - run: "cargo test"

  deploy:
    before:
      - echo "Deploying to ${target}"
    steps:
      - run: "echo Deploying ${target}"
    script: |
      // Note: `script` runs after `steps`, so anything a step needs must come
      // from a parameter rather than from the script. Merging both into one
      // ordered list is planned for M1 (docs/plan/03-config-schema.md).
      let target = param("target");
      if target == env("APP_ENV") {
        run("echo Deploying to production server");
      } else {
        run("echo Deploying to staging server");
      }
    after:
      - echo "Deploy done"
